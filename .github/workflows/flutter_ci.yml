name: Flutter CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "codex/**"]

jobs:
  mobile_flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile_flutter

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze Dart code
        run: dart analyze

      - name: Structural lint
        run: dart run tool/structural_lint.dart

      - name: Run unit and widget tests
        run: flutter test test/domain test/widget

      - name: Run app flow tests
        run: flutter test test/app_flow

  mobile_flutter_android_integration:
    runs-on: ubuntu-latest
    needs: mobile_flutter
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: |
            apps/mobile_flutter/android/**/*.gradle
            apps/mobile_flutter/android/gradle/wrapper/gradle-wrapper.properties

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: apps/mobile_flutter
        run: flutter pub get

      - name: Build Android integration APK
        working-directory: apps/mobile_flutter
        run: |
          flutter build apk --debug --target=integration_test/app_smoke_test.dart --dart-define=MY_MENU_API_MODE=fake
          cp build/app/outputs/flutter-apk/app-debug.apk /tmp/mymenu-app-smoke-debug.apk

      - name: Free disk for Android emulator
        run: |
          df -h
          rm -rf apps/mobile_flutter/build
          rm -rf apps/mobile_flutter/android/.gradle
          rm -rf ~/.gradle/caches
          rm -rf "$ANDROID_HOME/cmake" "$ANDROID_HOME/ndk" "$ANDROID_HOME/system-images"
          rm -rf /usr/share/dotnet /usr/local/share/boost /opt/ghc
          df -h

      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Android integration test
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          emulator-boot-timeout: 900
          script: cd apps/mobile_flutter && flutter drive --driver=integration_test/driver.dart --target=integration_test/app_smoke_test.dart --use-application-binary=/tmp/mymenu-app-smoke-debug.apk -d emulator-5554
