name: Flutter CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "codex/**"]

jobs:
  mobile_flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile_flutter

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.5"
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze Dart code
        run: dart analyze

      - name: Structural lint
        run: dart run tool/structural_lint.dart

      - name: Run tests
        run: flutter test

