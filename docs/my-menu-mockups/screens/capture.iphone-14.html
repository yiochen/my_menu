<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="mocklens:form-factor" content="phone"><meta name="mocklens:primary-device" content="iphone-14"><meta name="mocklens:target-devices" content="iphone-se,iphone-14,pixel-7"><meta name="mocklens:viewport" content="390x844"><title>Capture</title><link rel="stylesheet" href="./shared.css"></head><body>
<main class="screen sheet-screen stack"><div class="sheet-handle"></div><header class="topbar"><span style="width:40px"></span><h2>Capture</h2><button class="back-button" aria-label="Close" data-mocklens-action="Tap closes Capture without saving."><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg></button></header>
  <div class="capture-hero"><svg width="45" height="45" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 8.5A2.5 2.5 0 016.5 6h2l1.4-2h4.2l1.4 2h2A2.5 2.5 0 0120 8.5v9a2.5 2.5 0 01-2.5 2.5h-11A2.5 2.5 0 014 17.5z"/><circle cx="12" cy="13" r="4"/></svg></div>
  <div class="sheet-title"><h1>Save it while it’s fresh</h1><p class="small muted" style="margin-top:7px">Snap first. MyMenu can sort out where it belongs afterward.</p></div>
  <section class="stack-sm" style="margin-top:8px">
    <button class="capture-option primary-option" data-mocklens-action="Tap opens the camera immediately; if permission is missing, the platform permission prompt appears. When the original is saved locally, Capture closes and the real image appears immediately in Menu’s Photos mode with a quiet Organizing overlay."><span class="option-icon"><svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 8.5A2.5 2.5 0 016.5 6h2l1.4-2h4.2l1.4 2h2A2.5 2.5 0 0120 8.5v9a2.5 2.5 0 01-2.5 2.5h-11A2.5 2.5 0 014 17.5z"/><circle cx="12" cy="13" r="4"/></svg></span><span class="grow"><h3>Take Photo</h3><span class="small" style="opacity:.78">Fastest — point, snap, done</span></span><span>→</span></button>
    <button class="capture-option" data-mocklens-action="Tap opens the system photo picker. Once every selected original is saved locally, Capture closes and all images appear immediately in Photos in their picker order; background organization never blocks browsing."><span class="option-icon"><svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="2"/><path d="M21 15l-5-5L5 20"/></svg></span><span class="grow"><h3>Import Photos</h3><span class="small muted">Bring in one or a few</span></span><span class="soft-ink">›</span></button>
    <button class="capture-option" data-mocklens-action="Tap opens the Add Idea form. The form does not ask the user to choose a destination dish."><span class="option-icon">✎</span><span class="grow"><h3>Add Idea</h3><span class="small muted">Save a thought for later</span></span><span class="soft-ink">›</span></button>
  </section>
  <div class="status-strip" style="margin-top:auto"><span>✓</span><span>Captures save locally, even without signal.</span></div>
</main></body></html>
