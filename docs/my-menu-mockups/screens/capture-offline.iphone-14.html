<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="mocklens:form-factor" content="phone"><meta name="mocklens:primary-device" content="iphone-14"><meta name="mocklens:target-devices" content="iphone-se,iphone-14,pixel-7"><meta name="mocklens:viewport" content="390x844"><title>Capture queued offline</title><link rel="stylesheet" href="./shared.css"></head><body>
<main class="screen sheet-screen stack"><header class="topbar"><span style="width:40px"></span><h2>Captured</h2><button class="back-button" aria-label="Done" data-mocklens-action="Tap closes; the locally saved capture remains queued."><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg></button></header>
  <div class="result-art"><img class="food-image" src="../assets/miso-salmon.svg" alt="Offline captured photo" style="filter:saturate(.72)"></div>
  <div class="sheet-title"><p class="eyebrow">Saved locally ✓</p><h1>Captured—even offline</h1><p class="small muted" style="margin-top:8px">Nothing else to do. MyMenu will organize it when a connection returns.</p></div>
  <section class="card pad stack-sm"><div class="row gap-12"><span class="circle-button" style="color:var(--green);background:var(--green-soft);border:0">✓</span><div class="grow"><h3>Photo safe on this device</h3><p class="small muted">Available in your capture queue</p></div></div><div class="divider"></div><div class="row gap-12"><span class="circle-button" style="color:var(--muted);background:var(--oat);border:0">⌁</span><div class="grow"><h3>Organization waiting</h3><p class="small muted">Automatic matching needs a connection</p></div></div></section>
  <div class="status-strip orange"><span>↻</span><span>Queued · retry happens automatically</span></div>
  <div class="form-footer"><button class="button full" data-mocklens-action="Tap returns to the previous screen; no manual retry is required.">Done</button></div>
</main></body></html>
