<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="mocklens:form-factor" content="phone"><meta name="mocklens:primary-device" content="iphone-14"><meta name="mocklens:target-devices" content="iphone-se,iphone-14,pixel-7"><meta name="mocklens:viewport" content="390x844"><title>Add idea validation</title><link rel="stylesheet" href="./shared.css"></head><body>
<main class="screen sheet-screen stack"><header class="topbar"><button class="back-button" aria-label="Close" data-mocklens-action="Tap closes the form and offers to keep editing or discard the retained note."><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg></button><h2>Add an idea</h2><span style="width:40px"></span></header>
  <div><p class="eyebrow" style="color:var(--red)">Almost there</p><h1>Give this idea a name</h1><p class="small muted" style="margin-top:7px">It can be messy—we just need something you’ll recognize.</p></div>
