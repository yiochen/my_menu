<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="mocklens:form-factor" content="phone"><meta name="mocklens:primary-device" content="iphone-14"><meta name="mocklens:target-devices" content="iphone-se,iphone-14,pixel-7"><meta name="mocklens:viewport" content="390x844"><title>Move to another dish</title><link rel="stylesheet" href="./shared.css"></head><body>
<main class="screen sheet-screen stack">
  <header class="topbar"><button class="back-button" aria-label="Back" data-mocklens-action="Tap returns to Correct Grouping with both photos still selected."><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg></button><h2>Move to another dish</h2><span style="width:40px"></span></header>
  <div class="row gap-12 card pad"><div class="capture-strip" style="width:104px;grid-template-columns:repeat(2,1fr);flex:0 0 104px"><div class="capture-thumb"><img class="food-image" src="../assets/miso-salmon.svg" alt="Selected salmon photo" style="filter:hue-rotate(12deg)"></div><div class="capture-thumb"><img class="food-image" src="../assets/pho.svg" alt="Selected ramen photo"></div></div><div class="grow"><p class="eyebrow">2 selected photos</p><h2>Find their dish</h2><p class="small muted" style="margin-top:4px">They will move together.</p></div></div>
  <div class="search" data-mocklens-action="Tap and type to search every existing dish in the user's Menu by name."><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg><span>Search your dishes</span></div>
  <section class="stack-sm"><p class="small muted">Other dishes in your Menu</p><button class="destination-card selected" data-mocklens-action="Tap selects Weeknight Salmon Ramen as the destination for both photos."><div class="batch-cover"><img class="food-image" src="../assets/pho.svg" alt=""></div><div class="grow"><h3>Weeknight Salmon Ramen</h3><p class="small muted">4 cooks · last made Jul 8</p></div><span class="radio"></span></button><button class="destination-card" data-mocklens-action="Tap selects Lemon Garlic Linguine."><div class="batch-cover"><img class="food-image" src="../assets/linguine.svg" alt=""></div><div class="grow"><h3>Lemon Garlic Linguine</h3><p class="small muted">5 cooks · last made Jun 28</p></div><span class="radio"></span></button><button class="destination-card" data-mocklens-action="Tap selects Chicken Katsu Curry."><div class="batch-cover"><img class="food-image" src="../assets/katsu.svg" alt=""></div><div class="grow"><h3>Chicken Katsu Curry</h3><p class="small muted">3 cooks · last made May 19</p></div><span class="radio"></span></button></section>
  <div class="form-footer stack-sm"><button class="button full" data-mocklens-action="Tap moves both selected originals to Weeknight Salmon Ramen locally first, marks the correction as user-authored, and opens the corrected result while sync runs.">Move 2 photos</button><p class="tiny muted" style="text-align:center">The original images are never copied or changed.</p></div>
</main></body></html>
