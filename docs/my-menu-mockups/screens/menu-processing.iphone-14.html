<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="mocklens:form-factor" content="phone"><meta name="mocklens:primary-device" content="iphone-14"><meta name="mocklens:target-devices" content="iphone-se,iphone-14,pixel-7"><meta name="mocklens:viewport" content="390x844"><title>Menu while photos organize</title><link rel="stylesheet" href="./shared.css"><style>.processing-orb{animation:none;transform:rotate(28deg)}.processing-dish::after{animation:none;transform:translateX(0);opacity:.28}</style></head><body>
<main class="screen stack menu-screen">
  <header class="menu-sticky-bar"><button class="menu-search-bar" style="width:100%;text-align:left" data-mocklens-action="Tap searches finished dishes while capture organization continues. This compact utility header stays pinned while the grid scrolls."><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg><span>Search dishes, notes, ingredients</span></button></header>
  <button class="card context-card" data-mocklens-action="Tap opens Unsorted Photos. These 5 photos were not added to a dish, and the collection disappears when empty."><span class="thumb-stack"><span class="photo-art receipt"></span><span class="photo-art package"></span><span class="photo-art counter"></span></span><span class="grow"><span class="eyebrow">Needs your choice</span><h3>5 unsorted photos</h3><span class="small muted">Assign to a dish or delete</span></span><span class="soft-ink">›</span></button>
  <div class="section-head"><div class="row gap-8"><h2>All dishes</h2><span class="menu-collection-count">24</span></div><button class="menu-sort"><span>Newest first</span><span aria-hidden="true">⌄</span></button></div>
  <div class="dish-grid">
    <article class="card dish-card processing-dish" data-mocklens-action="Tap opens Processing Status. Capture closed automatically as soon as all 4 selected photos began uploading; this temporary card remains in the Menu grid until organization finishes and is not selectable in dish-management mode. In the product, the ring rotates and a gentle sheen passes over the card; reduced-motion users see the static ring shown here."><div class="processing-image"><span class="processing-orb" aria-label="Organizing"></span></div><div class="copy"><p class="eyebrow">Organizing now</p><h3>4 new photos</h3><p class="memory-cue">2 uploaded · keep browsing</p></div></article>
    <article class="card dish-card" data-mocklens-action="Tap opens Miso Salmon Bowl. Long-press enters selection mode with this finished dish selected; ideas and other zero-history dishes are also eligible. Assistive technologies expose Select dish as a custom action."><div class="image-wrap"><img class="food-image" src="../assets/miso-salmon.svg" alt="Miso salmon bowl"></div><div class="copy"><h3>Miso Salmon Bowl</h3><p class="tiny muted">8 cooks · 12 photos</p><p class="memory-cue">✎ “Broil for 2 minutes…”</p></div></article>
    <article class="card dish-card"><div class="image-wrap"><img class="food-image" src="../assets/linguine.svg" alt="Lemon garlic linguine"></div><div class="copy"><h3>Lemon Garlic Linguine</h3><p class="tiny muted">5 cooks · 7 photos</p><p class="memory-cue">↻ Last made Jun 28</p></div></article>
    <article class="card dish-card"><div class="image-wrap"><img class="food-image" src="../assets/katsu.svg" alt="Chicken katsu curry"></div><div class="copy"><h3>Chicken Katsu Curry</h3><p class="tiny muted">3 cooks · 5 photos</p><p class="memory-cue">✎ Crispier crumbs next time</p></div></article>
  </div>
</main>
