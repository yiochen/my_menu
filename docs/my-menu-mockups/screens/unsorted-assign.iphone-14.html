<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="mocklens:form-factor" content="phone"><meta name="mocklens:primary-device" content="iphone-14"><meta name="mocklens:target-devices" content="iphone-se,iphone-14,pixel-7"><meta name="mocklens:viewport" content="390x844"><title>Assign unsorted photo</title><link rel="stylesheet" href="./shared.css"></head><body>
<main class="screen sheet-screen stack">
  <header class="topbar"><button class="back-button" aria-label="Back" data-mocklens-action="Tap returns to Photo Options with the photo still unsorted."><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg></button><h2>Assign to dish</h2><span style="width:40px"></span></header>
  <div class="row gap-12"><div class="plan-thumb" style="width:68px;height:68px;flex-basis:68px"><div class="photo-art market" style="width:100%;height:100%"></div></div><div class="grow"><h1 style="font-size:24px">Choose its dish</h1><p class="small muted">Adds one source to today’s cooking occasion.</p></div></div>
  <div class="search" data-mocklens-action="Tap searches the user's dishes by name."><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg><span>Search your dishes</span></div>
  <section class="stack-sm"><p class="small muted">Suggested dishes</p><button class="destination-card selected" data-mocklens-action="Tap selects Sunday Pho."><div class="batch-cover"><img class="food-image" src="../assets/pho.svg" alt=""></div><div class="grow"><h3>Sunday Pho</h3><p class="small muted">12 cooks · last made Jun 12</p></div><span class="radio"></span></button><button class="destination-card" data-mocklens-action="Tap selects Charred Corn Ramen."><div class="batch-cover"><img class="food-image" src="../assets/miso-salmon.svg" alt=""></div><div class="grow"><h3>Charred Corn Ramen</h3><p class="small muted">1 cook · made today</p></div><span class="radio"></span></button><button class="destination-card" data-mocklens-action="Tap selects Crispy Tofu Salad."><div class="batch-cover"><img class="food-image" src="../assets/katsu.svg" alt=""></div><div class="grow"><h3>Crispy Tofu Salad</h3><p class="small muted">1 cook · made today</p></div><span class="radio"></span></button></section>
  <div class="form-footer"><button class="button full" data-mocklens-action="Tap assigns the original photo to Sunday Pho as one source, removes it from Unsorted Photos, and opens the assigned success state.">Assign to Sunday Pho</button></div>
</main></body></html>
