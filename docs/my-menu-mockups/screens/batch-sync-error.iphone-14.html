<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="mocklens:form-factor" content="phone"><meta name="mocklens:primary-device" content="iphone-14"><meta name="mocklens:target-devices" content="iphone-se,iphone-14,pixel-7"><meta name="mocklens:viewport" content="390x844"><title>Correction sync rollback</title><link rel="stylesheet" href="./shared.css"></head><body>
<main class="screen sheet-screen stack">
  <header class="topbar"><span style="width:40px"></span><h2>Correction not saved</h2><span style="width:40px"></span></header>
  <div class="sync-banner error"><span>!</span><span class="grow">These photos changed on another device, so your move was rolled back.</span></div>
  <div><h1>Your photo is safe</h1><p class="small muted" style="margin-top:7px">We restored the last synced grouping. Nothing was duplicated or deleted.</p></div>
  <section class="card batch-summary">
    <article class="batch-group"><div class="batch-head"><div class="batch-cover"><img class="food-image" src="../assets/miso-salmon.svg" alt=""></div><div class="grow"><h3>Miso Salmon Bowl</h3><p class="tiny muted">Restored · 2 photos from today</p></div></div><div class="batch-photos"><div class="batch-photo"><img class="food-image" src="../assets/miso-salmon.svg" alt=""></div><div class="batch-photo"><img class="food-image" src="../assets/miso-salmon.svg" alt="" style="filter:hue-rotate(12deg)"></div></div></article>
    <article class="batch-group"><div class="batch-head"><div class="batch-cover"><img class="food-image" src="../assets/pho.svg" alt=""></div><div class="grow"><h3>Charred Corn Ramen</h3><p class="tiny muted">Restored · 1 photo from today</p></div></div><div class="batch-photos"><div class="batch-photo"><img class="food-image" src="../assets/pho.svg" alt=""></div></div></article>
  </section>
  <div class="form-footer stack-sm"><button class="button full" data-mocklens-action="Tap reloads the current grouping and reopens Correct Grouping so the user can retry against fresh state.">Review and try again</button><button class="button secondary full" data-mocklens-action="Tap keeps the restored grouping and returns to Menu.">Keep restored grouping</button></div>
</main></body></html>
