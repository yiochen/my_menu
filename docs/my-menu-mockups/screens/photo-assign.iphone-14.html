<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="mocklens:form-factor" content="phone"><meta name="mocklens:primary-device" content="iphone-14"><meta name="mocklens:target-devices" content="iphone-se,iphone-14,pixel-7"><meta name="mocklens:viewport" content="390x844"><title>Add photo to dish</title><link rel="stylesheet" href="./shared.css"><link rel="stylesheet" href="./photo.css"></head><body>
<main class="screen sheet-screen stack photo-picker-screen"><header class="topbar"><button class="back-button" aria-label="Back" data-mocklens-action="Tap returns to the photo with no assignment change."><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg></button><h2>Add to dish</h2><span style="width:40px"></span></header>
  <div class="picked-photo-row"><div class="picked-photo"><img class="food-image" src="../assets/linguine.svg" alt="Linguine source photo"></div><div class="grow"><h1 style="font-size:23px">Choose where it belongs</h1><p class="tiny muted" style="margin-top:4px">Adds one source from today’s cooking.</p></div></div>
  <div class="search" data-mocklens-action="Tap searches the user's local dishes by title."><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg><span>Search your dishes</span></div>
  <section class="photo-picker-list"><p class="small muted">Suggested dishes</p><button class="destination-card selected" data-mocklens-action="Tap selects Sunday Pho; the completion action updates to this dish."><div class="batch-cover"><img class="food-image" src="../assets/pho.svg" alt=""></div><div class="grow"><h3>Sunday Pho</h3><p class="tiny muted">12 cooks · last made June 12</p></div><span class="radio"></span></button><button class="destination-card" data-mocklens-action="Tap selects Lemon Garlic Linguine."><div class="batch-cover"><img class="food-image" src="../assets/linguine.svg" alt=""></div><div class="grow"><h3>Lemon Garlic Linguine</h3><p class="tiny muted">5 cooks · last made June 28</p></div><span class="radio"></span></button><button class="destination-card" data-mocklens-action="Tap selects Garlic Butter Noodles."><div class="batch-cover"><img class="food-image" src="../assets/linguine.svg" alt=""></div><div class="grow"><h3>Garlic Butter Noodles</h3><p class="tiny muted">1 cook · made today</p></div><span class="radio"></span></button><button class="picker-create" data-mocklens-action="Tap opens a new-dish form using this original as the first source."><span style="font-size:20px">＋</span><span>Create a new dish instead</span></button></section>
  <div class="form-footer"><button class="button full" data-mocklens-action="Tap creates one local source association with Sunday Pho, changes counts from Unorganized 5 / Organized 13 to 4 / 14, and opens the assigned gallery with Undo. Any conflicting late AI result is ignored.">Add to Sunday Pho</button></div>
</main></body></html>
