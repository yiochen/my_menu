<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="mocklens:form-factor" content="phone"><meta name="mocklens:primary-device" content="iphone-14"><meta name="mocklens:target-devices" content="iphone-se,iphone-14,pixel-7"><meta name="mocklens:viewport" content="390x844"><title>Capture saved and organizing</title><link rel="stylesheet" href="./shared.css"></head><body>
<main class="screen sheet-screen stack"><header class="topbar"><span style="width:40px"></span><h2>Captured</h2><button class="back-button" aria-label="Done" data-mocklens-action="Tap closes immediately; organization continues in the background."><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg></button></header>
  <div class="result-art pulse-ring"><img class="food-image" src="../assets/miso-salmon.svg" alt="Newly captured salmon bowl" style="filter:saturate(.78) contrast(.94)"></div>
  <div class="sheet-title"><p class="eyebrow">Saved locally ✓</p><h1>Got it. You’re done.</h1><p class="small muted" style="margin-top:8px">MyMenu is finding the right place for this cooking moment.</p></div>
  <section class="card pad stack">
    <div class="row gap-12"><span class="circle-button" style="color:var(--green);background:var(--green-soft);border:0">✓</span><div class="grow"><h3>Photo saved on this device</h3><p class="small muted">Safe even if you close the app</p></div></div>
    <div class="divider"></div>
    <div class="row gap-12"><span class="circle-button" style="color:var(--orange-dark);background:var(--orange-soft);border:0">✨</span><div class="grow"><h3>Organizing now</h3><p class="small muted">Checking your 24 dishes for a match</p></div><span class="tiny muted">About 5 sec</span></div>
    <div class="progress-track"><span style="width:62%"></span></div>
  </section>
  <div class="status-strip neutral"><span>↗</span><span>You can leave—MyMenu will show the result when ready.</span></div>
  <div class="form-footer"><button class="button full" data-mocklens-action="Tap returns to the previous screen while background organization continues.">Done</button></div>
</main></body></html>
