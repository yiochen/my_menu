<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="mocklens:form-factor" content="phone"><meta name="mocklens:primary-device" content="iphone-14"><meta name="mocklens:target-devices" content="iphone-se,iphone-14,pixel-7"><meta name="mocklens:viewport" content="390x844"><title>Planned meal actions</title><link rel="stylesheet" href="./shared.css"></head>
<body><main class="screen sheet-screen stack"><div class="sheet-handle"></div><header class="topbar"><span style="width:40px"></span><h2>Planned dish</h2><button class="back-button" aria-label="Close" data-mocklens-action="Tap closes the actions sheet without changing the plan."><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg></button></header>
  <section class="card pad row gap-12"><div class="plan-thumb"><img class="food-image" src="../assets/katsu.svg" alt="Chicken katsu curry"></div><div class="grow"><h3>Chicken Katsu Curry</h3><p class="small muted">Wednesday, July 22 · Dinner</p></div></section>
  <section class="card action-menu">
    <button class="menu-action soft" data-mocklens-action="Tap opens the seven-day calendar with Wednesday selected; choosing another date moves only this planned dish."><span class="circle-button" style="box-shadow:none">↪</span><span class="grow"><h3>Move to another day</h3><span class="small muted">Keep it planned, change the date</span></span><span>›</span></button>
    <button class="menu-action" data-mocklens-action="Tap opens Chicken Katsu Curry detail."><span class="circle-button" style="box-shadow:none">↗</span><span class="grow"><h3>Open dish</h3><span class="small muted">Recipe, notes, and history</span></span><span>›</span></button>
    <div class="divider"></div>
    <button class="menu-action danger" data-mocklens-action="Tap removes Chicken Katsu Curry from Wednesday and shows the reversible Plan Removed outcome with Undo."><span class="circle-button" style="box-shadow:none;color:var(--red)">−</span><span class="grow"><h3>Remove from plan</h3><span class="small" style="color:var(--muted)">The dish stays in your menu</span></span></button>
  </section>
  <div class="status-strip neutral" style="margin-top:auto"><span>ⓘ</span><span>Removing a plan never deletes the dish or its history.</span></div>
</main></body></html>
