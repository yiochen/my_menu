<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="mocklens:form-factor" content="phone"><meta name="mocklens:primary-device" content="iphone-14"><meta name="mocklens:target-devices" content="iphone-se,iphone-14,pixel-7"><meta name="mocklens:viewport" content="390x844"><title>Unsorted photos</title><link rel="stylesheet" href="./shared.css"></head><body>
<main class="screen detail-screen stack">
  <header class="topbar"><button class="back-button" aria-label="Back" data-mocklens-action="Tap returns to Menu."><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg></button><div class="grow"><p class="tiny muted">Not added to dishes</p><h2>Unsorted photos</h2></div><span class="pill orange-soft">5 photos</span></header>
  <div><h1>You decide what belongs</h1><p class="small muted" style="margin-top:7px">MyMenu leaves uncertain and non-dish photos here instead of creating the wrong dish.</p></div>
  <div class="status-strip neutral"><span>◎</span><span>Photos stay recoverable until you assign or delete them.</span></div>
  <section class="photo-grid">
    <button class="card photo-tile" data-mocklens-action="Tap opens Photo Options for the market photo, with Assign to dish and Delete photo paths."><div class="photo-art market" role="img" aria-label="Tomatoes and market produce"></div><div class="copy"><h3>Today · 6:41 PM</h3><p class="tiny muted">Could be ingredients</p></div></button>
    <button class="card photo-tile"><div class="photo-art receipt" role="img" aria-label="Grocery receipt"></div><div class="copy"><h3>Today · 6:39 PM</h3><p class="tiny muted">Not a dish</p></div></button>
    <button class="card photo-tile"><div class="photo-art package" role="img" aria-label="Pantry package"></div><div class="copy"><h3>Jul 24 · 5:12 PM</h3><p class="tiny muted">Not a dish</p></div></button>
    <button class="card photo-tile"><div class="photo-art counter" role="img" aria-label="Kitchen counter"></div><div class="copy"><h3>Jul 21 · 7:08 PM</h3><p class="tiny muted">Too uncertain</p></div></button>
    <button class="card photo-tile"><div class="image-wrap" style="height:160px"><img class="food-image" src="../assets/linguine.svg" alt="Blurry noodle dish" style="filter:blur(3px) saturate(.6)"></div><div class="copy"><h3>Jul 19 · 8:17 PM</h3><p class="tiny muted">Too uncertain</p></div></button>
  </section>
</main></body></html>
