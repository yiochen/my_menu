<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="mocklens:form-factor" content="phone"><meta name="mocklens:primary-device" content="iphone-14"><meta name="mocklens:target-devices" content="iphone-se,iphone-14,pixel-7"><meta name="mocklens:viewport" content="390x844"><title>Delete unsorted photo</title><link rel="stylesheet" href="./shared.css"></head><body>
<main class="screen sheet-screen stack">
  <header class="topbar"><span style="width:40px"></span><h2>Delete photo?</h2><span style="width:40px"></span></header>
  <div class="photo-art market photo-detail" style="height:220px" role="img" aria-label="Tomatoes and market produce"></div>
  <div class="sheet-title"><div class="result-icon" style="width:66px;height:66px;background:var(--red-soft);color:var(--red);margin-bottom:12px">⌫</div><h1>Remove this original?</h1><p class="small muted" style="margin-top:8px">It is not attached to a dish. Deleting removes it from MyMenu on this device and synced storage.</p></div>
  <div class="status-strip" style="color:var(--red);background:var(--red-soft)"><span>!</span><span>You’ll have a short Undo window before permanent removal.</span></div>
  <div class="form-footer stack-sm"><button class="button danger-button full" data-mocklens-action="Tap removes the photo locally, enqueues remote deletion, and opens Unsorted Deleted with an Undo toast.">Delete photo</button><button class="button secondary full" data-mocklens-action="Tap keeps the photo and returns to Photo Options.">Keep photo</button></div>
</main></body></html>
