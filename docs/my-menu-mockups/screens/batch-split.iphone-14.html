<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="mocklens:form-factor" content="phone"><meta name="mocklens:primary-device" content="iphone-14"><meta name="mocklens:target-devices" content="iphone-se,iphone-14,pixel-7"><meta name="mocklens:viewport" content="390x844"><title>Make a new dish</title><link rel="stylesheet" href="./shared.css"></head><body>
<main class="screen sheet-screen stack">
  <header class="topbar"><button class="back-button" aria-label="Back" data-mocklens-action="Tap returns to Correct Grouping with both photos still selected and no dish created."><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg></button><h2>Make a new dish</h2><span style="width:40px"></span></header>
  <div class="row gap-12 card pad-lg"><div class="capture-strip" style="width:116px;grid-template-columns:repeat(2,1fr);flex:0 0 116px"><div class="capture-thumb"><img class="food-image" src="../assets/miso-salmon.svg" alt="Selected salmon photo" style="filter:hue-rotate(12deg)"></div><div class="capture-thumb"><img class="food-image" src="../assets/pho.svg" alt="Selected ramen photo"></div></div><div class="grow"><p class="eyebrow">2 selected photos</p><h2>Start one new history</h2><p class="small muted" style="margin-top:4px">Both originals move together.</p></div></div>
  <div class="field"><label for="dish-name">Dish name</label><input class="input" id="dish-name" value="Salmon Ramen" aria-label="Dish name"><p class="tiny muted">You can change the name now or anytime from Dish Detail.</p></div>
  <div class="form-footer"><button class="button full" data-mocklens-action="Tap creates one new dish with both selected originals as source photos, marks the correction as user-authored, and syncs without duplicating either image.">Create</button></div>
</main></body></html>
