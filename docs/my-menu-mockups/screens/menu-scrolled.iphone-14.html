  <div class="dish-grid">

    <article class="card dish-card"><div class="image-wrap"><img class="food-image" src="../assets/pho.svg" alt="Pho"></div><div class="copy"><h3>Sunday Pho</h3><p class="tiny muted">12 cooks · 18 photos</p><p class="memory-cue">↻ Evolving since 2024</p></div></article>

    <article class="card dish-card"><div class="image-wrap"><img class="food-image" src="../assets/katsu.svg" alt="Weeknight dumpling idea"></div><div class="copy"><h3>Weeknight Dumpling Idea</h3><p class="tiny muted">Not cooked yet</p></div></article>
    <article class="card dish-card"><div class="image-wrap"><img class="food-image" src="../assets/pho.svg" alt="Ginger chicken soup"></div><div class="copy"><h3>Ginger Chicken Soup</h3><p class="tiny muted">4 cooks · 6 photos</p></div></article>
