<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="mocklens:form-factor" content="phone"><meta name="mocklens:primary-device" content="iphone-14"><meta name="mocklens:target-devices" content="iphone-se,iphone-14,pixel-7"><meta name="mocklens:viewport" content="390x844"><title>Menu · Photos</title><link rel="stylesheet" href="./shared.css"><link rel="stylesheet" href="./photo.css"></head><body>
<main class="screen photos-screen">
  <div class="photos-fixed-chrome"><div class="photos-title-row"><button class="photos-back" aria-label="Back to dishes" data-mocklens-action="Tap returns to the 24-dish grid and restores its search and filters."><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg></button><div class="photos-title"><h1>Photos</h1><span>18</span></div><button class="photo-select" data-mocklens-action="Tap enters accessible multi-selection; long-pressing a tile is a shortcut to the same mode.">Select</button></div><div class="photo-filter-row"><div class="photo-filters" aria-label="Photo organization"><span class="photo-filter active">All 18</span><button class="photo-filter" data-mocklens-action="Tap shows the five photos without a dish assignment, including organizing, review, and failed states.">Unorganized 5</button><button class="photo-filter" data-mocklens-action="Tap shows the thirteen photos currently assigned to dishes.">Organized 13</button></div></div></div>
  <section class="photo-date-group"><header class="photo-date-head"><h2>Today</h2><span>6 photos</span></header><div class="gallery-grid">
    <button class="gallery-tile" aria-label="Salmon bowl photo, organizing, today 6:48 PM" data-mocklens-action="Tap opens the image-dominant Organizing detail. The original is already usable; Organize now lets the user assign it before AI finishes."><img class="crop-close" src="../assets/miso-salmon.svg" alt=""><span class="tile-status organizing">Organizing</span></button>
    <button class="gallery-tile" aria-label="Chicken curry photo, needs review, today 6:45 PM" data-mocklens-action="Tap opens Review detail with the suggested dish, Choose another dish, and Create new dish paths."><img class="crop-left" src="../assets/katsu.svg" alt=""><span class="tile-status review">Review</span></button>
    <button class="gallery-tile" aria-label="Pho photo, organized in Sunday Pho, today 6:42 PM" data-mocklens-action="Tap opens organized photo detail with Sunday Pho, View dish, Change dish, and More actions."><img class="crop-right" src="../assets/pho.svg" alt=""><span class="tile-status">Sunday Pho</span></button>
    <button class="gallery-tile" aria-label="Linguine photo, unorganized, today 1:16 PM" data-mocklens-action="Tap opens unorganized photo detail with Add to dish and Create new dish."><img class="crop-close" src="../assets/linguine.svg" alt=""><span class="tile-status">Unorganized</span></button>
    <button class="gallery-tile" aria-label="Miso salmon photo, organized in Miso Salmon Bowl, today 1:14 PM"><img class="crop-left" src="../assets/miso-salmon.svg" alt=""><span class="tile-status">Miso Salmon Bowl</span></button>
    <button class="gallery-tile" aria-label="Noodle photo, organization failed, today 1:12 PM" data-mocklens-action="Tap opens the photo with Retry and manual organization; failure never replaces or hides the original."><img class="crop-right soft-photo" src="../assets/linguine.svg" alt=""><span class="tile-status failed">Couldn’t organize</span></button>
  </div></section>
  <section class="photo-date-group"><header class="photo-date-head"><h2>Yesterday</h2><span>6 of 12 photos</span></header><div class="gallery-grid">
    <button class="gallery-tile" aria-label="Chicken katsu photo, organized in Chicken Katsu Curry, yesterday"><img class="crop-right" src="../assets/katsu.svg" alt=""><span class="tile-status">Chicken Katsu Curry</span></button>
    <button class="gallery-tile" aria-label="Linguine photo, organized in Lemon Garlic Linguine, yesterday"><img class="crop-left" src="../assets/linguine.svg" alt=""><span class="tile-status" data-mocklens-ignore="Compact gallery overlays intentionally truncate long user-provided dish names; the tile label and photo detail expose the full name.">Lemon Garlic Linguine</span></button>
    <button class="gallery-tile" aria-label="Pho photo, organized in Sunday Pho, yesterday"><img class="crop-close" src="../assets/pho.svg" alt=""><span class="tile-status">Sunday Pho</span></button>
    <button class="gallery-tile" aria-label="Salmon photo, organized in Miso Salmon Bowl, yesterday"><img class="crop-right" src="../assets/miso-salmon.svg" alt=""><span class="tile-status">Miso Salmon Bowl</span></button>
    <button class="gallery-tile" aria-label="Garlic noodles photo, organized in Garlic Butter Noodles, yesterday"><img class="crop-left" src="../assets/linguine.svg" alt=""><span class="tile-status">Garlic Butter Noodles</span></button>
    <button class="gallery-tile" aria-label="Katsu photo, organized in Chicken Katsu Curry, yesterday"><img class="crop-close" src="../assets/katsu.svg" alt=""><span class="tile-status">Chicken Katsu Curry</span></button>
  </div></section>
</main>
