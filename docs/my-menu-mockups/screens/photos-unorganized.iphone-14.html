<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="mocklens:form-factor" content="phone"><meta name="mocklens:primary-device" content="iphone-14"><meta name="mocklens:target-devices" content="iphone-se,iphone-14,pixel-7"><meta name="mocklens:viewport" content="390x844"><title>Photos · Unorganized</title><link rel="stylesheet" href="./shared.css"><link rel="stylesheet" href="./photo.css"></head><body>
<main class="screen photos-screen">
  <div class="photos-fixed-chrome"><div class="photos-title-row"><button class="photos-back" aria-label="Back to dishes" data-mocklens-action="Tap returns to Dishes and restores its search and filters."><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg></button><div class="photos-title"><h1>Photos</h1><span>18</span></div><button class="photo-select" data-mocklens-action="Tap selects multiple photos for one assignment, split, or deletion task.">Select</button></div><div class="photo-filter-row"><div class="photo-filters"><button class="photo-filter" data-mocklens-action="Tap returns to all eighteen photos.">All 18</button><span class="photo-filter active">Unorganized 5</span><button class="photo-filter" data-mocklens-action="Tap shows the thirteen locally assigned photos.">Organized 13</button></div></div></div>
  <section class="photo-date-group"><header class="photo-date-head"><h2>Today</h2><span>3 photos</span></header><div class="gallery-grid">
    <button class="gallery-tile" aria-label="Chicken curry photo, needs review, today 6:45 PM" data-mocklens-action="Tap opens Review detail. The user can confirm Chicken Katsu Curry, choose another dish, or create a new dish."><img class="crop-left" src="../assets/katsu.svg" alt=""><span class="tile-status review">Review</span></button>
    <button class="gallery-tile" aria-label="Salmon bowl photo, organizing, today 6:48 PM" data-mocklens-action="Tap opens the photo while background organization continues; Organize now makes a manual assignment authoritative."><img class="crop-close" src="../assets/miso-salmon.svg" alt=""><span class="tile-status organizing">Organizing</span></button>
    <button class="gallery-tile" aria-label="Linguine photo, unorganized, today 1:16 PM" data-mocklens-action="Tap opens unorganized detail with Add to dish and Create new dish."><img class="crop-right" src="../assets/linguine.svg" alt=""><span class="tile-status">Unorganized</span></button>
  </div></section>
  <section class="photo-date-group"><header class="photo-date-head"><h2>July 31</h2><span>2 photos</span></header><div class="gallery-grid">
    <button class="gallery-tile" aria-label="Blurry noodle photo, organization failed, July 31" data-mocklens-action="Tap keeps the original visible and offers Retry or manual Add to dish."><img class="crop-close soft-photo" src="../assets/linguine.svg" alt=""><span class="tile-status failed">Couldn’t organize</span></button>
    <button class="gallery-tile" aria-label="Market produce photo, unorganized, July 31" data-mocklens-action="Tap opens the photo. MyMenu has not created a dish; the user may assign, create, or delete it."><div class="photo-art market" role="img" aria-label="Tomatoes and market produce"></div><span class="tile-status">Unorganized</span></button>
  </div></section>
  <div class="quiet-explainer" style="margin:18px 4px 0" data-mocklens-action="This explanation is static; processing vocabulary remains hidden from the user.">These photos are safe on this device. Organize any of them now, or let MyMenu keep trying quietly.</div>
</main>
