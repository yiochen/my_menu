<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="mocklens:form-factor" content="phone"><meta name="mocklens:primary-device" content="iphone-14"><meta name="mocklens:target-devices" content="iphone-se,iphone-14,pixel-7"><meta name="mocklens:viewport" content="390x844"><title>Cook again</title><link rel="stylesheet" href="./shared.css"></head><body>
<main class="screen sheet-screen stack"><div class="sheet-handle"></div><header class="topbar"><span style="width:40px"></span><h2>Cook again</h2><button class="back-button" aria-label="Close" data-mocklens-action="Tap closes without starting a cooking occasion or changing the plan."><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg></button></header>
  <div class="result-art"><img class="food-image" src="../assets/miso-salmon.svg" alt="Miso salmon bowl"></div><div class="sheet-title"><h1>Miso Salmon Bowl</h1><p class="small muted" style="margin-top:7px">Are you cooking now or saving it for another day?</p></div>
  <section class="stack-sm">
    <button class="capture-option primary-option" data-mocklens-action="Tap opens the recipe in cooking mode and starts a draft occasion for today. Photos captured during it group together; it counts as made only when the user finishes."><span class="option-icon"><svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 5v14l11-7z"/></svg></span><span class="grow"><h3>I’m cooking now</h3><span class="small" style="opacity:.78">Open recipe · group today’s photos</span></span><span>→</span></button>
    <button class="capture-option" data-mocklens-action="Tap opens the selected-day calendar and schedules this dish without changing made count."><span class="option-icon"><svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4m8-4v4M3 10h18"/></svg></span><span class="grow"><h3>Plan for later</h3><span class="small muted">Choose any day</span></span><span class="soft-ink">›</span></button>
  </section>
  <section class="card soft-card pad stack-sm"><h3>What becomes a “cook”?</h3><p class="small muted">One finished cooking occasion. You can add several source photos without increasing the made count.</p></section>
  <div class="status-strip" style="margin-top:auto"><span>✓</span><span>Your existing 8 cooks and 12 photos stay unchanged until you finish.</span></div>
</main></body></html>
