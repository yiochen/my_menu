<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="mocklens:form-factor" content="phone"><meta name="mocklens:primary-device" content="iphone-14"><meta name="mocklens:target-devices" content="iphone-se,iphone-14,pixel-7"><meta name="mocklens:viewport" content="390x844"><title>Unsorted photo options</title><link rel="stylesheet" href="./shared.css"></head><body>
<main class="screen sheet-screen stack">
  <header class="topbar"><button class="back-button" aria-label="Back" data-mocklens-action="Tap returns to Unsorted Photos without changing this photo."><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg></button><h2>Photo options</h2><span style="width:40px"></span></header>
  <div class="photo-art market photo-detail" role="img" aria-label="Tomatoes and market produce"></div>
  <div><p class="eyebrow">Unsorted · today 6:41 PM</p><h1>Keep it with a dish?</h1><p class="small muted" style="margin-top:7px">MyMenu was not confident this was a finished dish, so nothing was filed automatically.</p></div>
  <section class="stack-sm">
    <button class="capture-option primary-option" data-mocklens-action="Tap opens Assign to Dish with search and suggested existing dishes."><span class="option-icon">↗</span><span class="grow"><h3>Assign to a dish</h3><span class="small" style="opacity:.78">Add as a source photo</span></span><span>→</span></button>
    <button class="capture-option" data-mocklens-action="Tap opens a destructive confirmation before removing this original from MyMenu."><span class="option-icon" style="color:var(--red);background:var(--red-soft)">⌫</span><span class="grow"><h3 style="color:var(--red)">Delete photo</h3><span class="small muted">Remove it from MyMenu</span></span><span class="soft-ink">›</span></button>
  </section>
</main></body></html>
