<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="mocklens:form-factor" content="phone"><meta name="mocklens:primary-device" content="iphone-14"><meta name="mocklens:target-devices" content="iphone-se,iphone-14,pixel-7"><meta name="mocklens:viewport" content="390x844"><title>Camera permission</title><link rel="stylesheet" href="./shared.css"></head><body>
<main class="screen sheet-screen stack"><header class="topbar"><span style="width:40px"></span><h2>Camera access</h2><button class="back-button" aria-label="Close" data-mocklens-action="Tap returns to Capture, where Import Photos and Add Idea remain available."><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg></button></header>
  <div class="offline-art" style="color:var(--orange);background:var(--orange-soft)"><svg width="54" height="54" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 8.5A2.5 2.5 0 016.5 6h2l1.4-2h4.2l1.4 2h2A2.5 2.5 0 0120 8.5v9a2.5 2.5 0 01-2.5 2.5h-11A2.5 2.5 0 014 17.5z"/><circle cx="12" cy="13" r="4"/><path d="M3 3l18 18"/></svg></div>
  <div class="sheet-title"><h1>Camera access is off</h1><p class="small muted" style="margin-top:8px">Turn it on in Settings to snap food directly. You can still import a photo or add an idea right now.</p></div>
  <button class="button full" data-mocklens-action="Tap opens the operating-system Settings page for MyMenu camera permission.">Open Settings</button>
  <section class="stack-sm"><button class="capture-option" data-mocklens-action="Tap opens the system photo picker; camera permission is not required."><span class="option-icon">▣</span><span class="grow"><h3>Import Photos</h3><span class="small muted">Choose from your library</span></span><span>›</span></button><button class="capture-option" data-mocklens-action="Tap opens Add Idea; camera permission is not required."><span class="option-icon">✎</span><span class="grow"><h3>Add Idea</h3><span class="small muted">Save a thought instead</span></span><span>›</span></button></section>
  <p class="tiny muted" style="text-align:center;margin-top:auto">MyMenu only accesses the camera when you choose Take Photo.</p>
</main></body></html>
