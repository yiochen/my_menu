<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="mocklens:form-factor" content="phone"><meta name="mocklens:primary-device" content="iphone-14"><meta name="mocklens:target-devices" content="iphone-se,iphone-14,pixel-7"><meta name="mocklens:viewport" content="390x844"><title>Capture created dish</title><link rel="stylesheet" href="./shared.css"></head><body>
<main class="screen sheet-screen stack"><header class="topbar"><span style="width:40px"></span><h2>Capture organized</h2><button class="back-button" aria-label="Close" data-mocklens-action="Tap closes; the new dish remains in Menu."><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg></button></header>
  <div class="result-icon" style="background:var(--orange-soft);color:var(--orange)"><svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 5.5C4 4.7 4.7 4 5.5 4H11v16H5.5A1.5 1.5 0 014 18.5zM20 5.5C20 4.7 19.3 4 18.5 4H13v16h5.5a1.5 1.5 0 001.5-1.5z"/><path d="M7 9h2m6 0h2"/></svg></div>
  <div class="sheet-title"><p class="eyebrow">New dish created</p><h1>Charred Corn Ramen</h1><p class="small muted" style="margin-top:8px">It didn’t match your 24 dishes, so MyMenu started a new living record.</p></div>
  <section class="card pad row gap-14"><div class="plan-thumb" style="width:82px;height:82px;flex-basis:82px"><img class="food-image" src="../assets/pho.svg" alt="Captured ramen bowl"></div><div class="grow"><h2>Charred Corn Ramen</h2><p class="small muted" style="margin-top:5px">1 cook · 1 source photo</p><p class="memory-cue">✨ Recipe draft ready to review</p></div></section>
  <button class="button full" data-mocklens-action="Tap opens the newly created dish so the user can review its name, draft recipe, and source.">Review new dish <span>→</span></button>
  <div class="row" style="justify-content:center;gap:22px"><button class="text-button" data-mocklens-action="Tap opens the dish title prefilled for correction.">Rename</button><button class="text-button" style="color:var(--muted)" data-mocklens-action="Tap deletes the auto-created dish but keeps the photo in the unorganized capture queue.">Undo creation</button></div>
</main></body></html>
