<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="mocklens:form-factor" content="phone"><meta name="mocklens:primary-device" content="iphone-14"><meta name="mocklens:target-devices" content="iphone-se,iphone-14,pixel-7"><meta name="mocklens:viewport" content="390x844"><title>Improve cover result</title><link rel="stylesheet" href="./shared.css"></head><body>
<main class="screen sheet-screen stack"><header class="topbar"><span style="width:40px"></span><h2>Choose the cover image</h2><span style="width:40px"></span></header>
  <div><p class="eyebrow">Ready to compare</p><h1>Which feels more like your menu?</h1><p class="small muted" style="margin-top:7px">The proposed cover is inspired by three real source photos. Those originals stay untouched.</p></div>
  <section class="cover-compare">
    <button class="cover-option" data-mocklens-action="Tap selects the current cover; Keep current then closes without a change."><div class="image-wrap"><img class="food-image" src="../assets/miso-salmon.svg" alt="Current cover image"></div><p>Current cover</p></button>
    <button class="cover-option selected" data-mocklens-action="Tap selects the proposed cover; Use this cover then replaces only the dish cover image."><div class="image-wrap"><img class="food-image" src="../assets/miso-salmon-improved.svg" alt="Proposed improved cover image"></div><p>✨ Proposed cover</p></button>
  </section>
  <section class="card pad stack-sm"><div class="row gap-10"><span style="color:var(--green)">✓</span><p class="small">12 source photos and 8 cooking occasions stay unchanged.</p></div><div class="row gap-10"><span style="color:var(--green)">✓</span><p class="small">The current cover remains available until you confirm.</p></div></section>
  <div class="form-footer stack-sm"><button class="button full" data-mocklens-action="Tap makes the proposed image the dish cover and returns to Dish Detail; source photos remain unchanged.">Use this cover <span>→</span></button><button class="button secondary full" data-mocklens-action="Tap keeps the current cover and closes this comparison without changing anything.">Keep current cover</button></div>
</main></body></html>
