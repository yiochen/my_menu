<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="mocklens:form-factor" content="phone"><meta name="mocklens:primary-device" content="iphone-14"><meta name="mocklens:target-devices" content="iphone-se,iphone-14,pixel-7"><meta name="mocklens:viewport" content="390x844"><title>Add idea</title><link rel="stylesheet" href="./shared.css"></head><body>
<main class="screen sheet-screen stack"><header class="topbar"><button class="back-button" aria-label="Close" data-mocklens-action="Tap closes the form and discards the unsaved idea after confirmation if content changed."><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg></button><h2>Add an idea</h2><span style="width:40px"></span></header>
  <div><p class="eyebrow">For later</p><h1>What do you wanna cook?</h1><p class="small muted" style="margin-top:7px">A rough thought is plenty. We’ll help shape it later.</p></div>
  <section class="stack"><div class="field"><label for="idea">Dish idea</label><input id="idea" class="input" value="Charred corn ramen" aria-label="Dish idea"></div><div class="field"><label for="note">Anything you want to remember? <span class="muted" style="font-weight:600">Optional</span></label><textarea id="note" class="textarea">Try a miso butter broth with lime, scallions, and the leftover grilled corn.</textarea><span class="tiny muted">This becomes the first note on the new dish.</span></div></section>
  <div class="card soft-card pad row gap-10"><span style="font-size:22px">✨</span><p class="small muted">AI can suggest a name, ingredients, and steps when you’re ready.</p></div>
  <div class="form-footer"><button class="button full" data-mocklens-action="Tap saves the idea locally, closes the form, and lets AI organize it later without another classification question. Planning remains a separate task in Plan.">Save idea <span>→</span></button></div>
</main></body></html>
