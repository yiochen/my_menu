<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="mocklens:form-factor" content="phone"><meta name="mocklens:primary-device" content="iphone-14"><meta name="mocklens:target-devices" content="iphone-se,iphone-14,pixel-7"><meta name="mocklens:viewport" content="390x844"><title>Add to plan</title><link rel="stylesheet" href="./shared.css"></head><body>
<main class="screen sheet-screen stack">
  <header class="topbar"><button class="back-button" aria-label="Close" data-mocklens-action="Tap closes the picker without changing the week."><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg></button><h2>Add to Wednesday</h2><span style="width:40px"></span></header>
  <div><p class="eyebrow">Wednesday · July 22</p><h1>Add another dish</h1><p class="small muted" style="margin-top:6px">Two dishes are already planned. Choose one more.</p></div>
  <div class="search"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg><span>Search your 24 dishes</span></div>
  <div class="row gap-8" style="overflow:hidden"><span class="pill active">Suggested</span><span class="pill">Quick</span><span class="pill">Favorites</span></div>
  <section class="stack-sm">
    <button class="choice selected" data-mocklens-action="Tap selects Miso Salmon Bowl; Save to plan assigns it to Wednesday evening."><div class="plan-thumb"><img class="food-image" src="../assets/miso-salmon.svg" alt="Miso salmon bowl"></div><div class="grow"><h3>Miso Salmon Bowl</h3><p class="small muted">25 min · Made 8 times</p></div><i class="radio"></i></button>
    <button class="choice"><div class="plan-thumb"><img class="food-image" src="../assets/linguine.svg" alt="Lemon garlic linguine"></div><div class="grow"><h3>Lemon Garlic Linguine</h3><p class="small muted">30 min · Made 5 times</p></div><i class="radio"></i></button>
    <button class="choice"><div class="plan-thumb"><img class="food-image" src="../assets/katsu.svg" alt="Chicken katsu curry"></div><div class="grow"><h3>Chicken Katsu Curry</h3><p class="small muted">45 min · Made 3 times</p></div><i class="radio"></i></button>
    <button class="choice"><div class="plan-thumb"><img class="food-image" src="../assets/pho.svg" alt="Pho"></div><div class="grow"><h3>Sunday Pho</h3><p class="small muted">Long cook · Weekend favorite</p></div><i class="radio"></i></button>
  </section>
  <div class="form-footer"><button class="button full" data-mocklens-action="Tap adds the selected dish to Wednesday without replacing either existing planned dish, then returns to the selected-day Plan screen.">Add to Wednesday <span>→</span></button></div>
</main></body></html>
